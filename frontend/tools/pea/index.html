<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Análisis (PEA)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Estilos heredados del Campus -->
  <link rel="stylesheet" href="/frontend/css/style.css" />
</head>
<body>

  <main class="pea-home">

    <h1>Análisis (PEA)</h1>

    <p class="pea-desc">
      Registro y análisis de conducta operativa.
    </p>

    <div class="pea-actions">

      <button id="pea-btn-register" class="btn-main">
        Cargar registro
      </button>

      <button id="pea-btn-history" class="btn-main">
        Historial
      </button>

      <button id="pea-btn-back" class="btn-main">
        Volver al Campus
      </button>

      <button id="pea-btn-theme" class="btn-main">
        Claro / Oscuro
      </button>

    </div>

    <div class="pea-access">
      <button id="pea-btn-views" class="btn-secondary">
        Vistas guardadas
      </button>

      <button id="pea-btn-audit" class="btn-secondary">
        Modo Auditoría
      </button>
    </div>

  </main>

  <script>
    // =========================================================
    // 🔐 PEA — IDENTIDAD COMPATIBLE CON CAMPUS (NO INVASIVA)
    // - NO modifica el Campus
    // - NO crea email global
    // - SOLO consume CFC_EMAIL
    // - Genera hash exclusivo para PEA
    // =========================================================
    (function ensurePEAIdentity() {
      const email = localStorage.getItem("CFC_EMAIL");

      if (!email) {
        alert(
          "PEA no puede iniciarse.\n\n" +
          "No se detectó una sesión válida del Campus.\n" +
          "Por favor, ingresá desde el Campus principal."
        );

        // Falla segura: no permitir uso sin identidad
        throw new Error("PEA BLOCKED: CFC_EMAIL no disponible");
      }

      // 🔐 Hash interno SOLO para PEA (no afecta al Campus)
      try {
        const encoder = new TextEncoder();
        crypto.subtle
          .digest("SHA-256", encoder.encode(email))
          .then(buffer => {
            const hashArray = Array.from(new Uint8Array(buffer));
            const hashHex = hashArray
              .map(b => b.toString(16).padStart(2, "0"))
              .join("")
              .toUpperCase();

            // Namespace exclusivo PEA
            localStorage.setItem("PEA_EMAIL_HASH", hashHex);
          });
      } catch (e) {
        console.error("PEA HASH ERROR:", e);
        throw new Error("PEA BLOCKED: fallo al generar identidad");
      }
    })();
  </script>

  <script src="./pea_home.js"></script>

</body>
</html>
