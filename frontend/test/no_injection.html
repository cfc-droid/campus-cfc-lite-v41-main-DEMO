<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEST — Sin Inyecciones</title>

  <!-- 🔒 ÚNICO script permitido: Domain Lock Lite -->
  <script src="../js/domain_lock_lite.js?v=20251129" defer></script>

  <style>
    body {
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 80px;
    }
    .box {
      border: 2px solid #FFD700;
      padding: 20px;
      width: 70%;
      margin: auto;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>TEST — Página sin scripts del Campus</h1>
    <p>Esta página NO carga auto_injector.js, NO carga theme_chapter, NO carga badge, NO carga progress/exam/motivation.</p>
    <p>Si se recarga sola o expulsa → el problema NO es del Campus.</p>
    <p>Si NO se recarga → la causa está en un script profundo.</p>
    <br><br>
    <strong>Hora actual:</strong>
    <div id="now"></div>
  </div>

  <!-- Mostrar reloj para detectar reinicio -->
  <script>
    setInterval(() => {
      document.getElementById("now").textContent = new Date().toLocaleString();
    }, 1000);
  </script>
