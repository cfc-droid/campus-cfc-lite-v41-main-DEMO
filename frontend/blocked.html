<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso bloqueado — Campus CFC</title>

  <!-- ✔ Usa tus estilos premium ya existentes -->
  <link rel="stylesheet" href="./css/variables.css?v=20251112" />
  <link rel="stylesheet" href="./css/premium.min.css?v=20251112" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #ffd700;
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .blocked-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 215, 0, 0.25);
      padding: 35px 28px;
      border-radius: 20px;
      text-align: center;
      width: 360px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
      animation: fadeIn 0.6s ease-out;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #ffd700;
    }

    p {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 22px;
      line-height: 1.45;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #ffd700;
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #fff;
      color: #000;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="blocked-box">
    <h1>Acceso bloqueado</h1>

    <p>
      Este contenido no está autorizado en este entorno.<br><br>
      Por motivos de seguridad, solo podés acceder desde el dominio oficial
      y fuera de iframes, localhost, WebView o rutas file://.
    </p>

    <button onclick="goLogin()">Ir al login</button>
  </div>

  <script>
    console.log("🛡️ CFC-LOCK LITE — blocked.html cargado (V72-FINAL)");

    function goLogin() {
      console.log("➡️ Redirigiendo al login desde blocked.html");
      window.location.href = "./html/login.html";
    }
  </script>

</body>
</html>
