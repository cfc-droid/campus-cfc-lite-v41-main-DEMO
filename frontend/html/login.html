   <script>
  document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const license = document.getElementById("license").value.trim();
    const errorMsg = document.getElementById("errorMsg");

    if (email === "" || license === "") {
      errorMsg.style.display = "block";
      console.log("❌ Acceso denegado — faltan credenciales");
      return;
    }

    errorMsg.style.display = "none";
    console.log("✅ Credenciales ingresadas — login permitido (sin MSCU)");

    // ✅ VALIDACIÓN REAL CONTRA TABLA CFC_USERS — ACCIÓN 4/5-C.2
if (!CFC_USERS.hasOwnProperty(email) || CFC_USERS[email] !== license) {

  // ✅ OCULTAR MENSAJES ANTERIORES
  errorMsg.style.display = "none";
  document.getElementById("errorPremium").style.display = "none";

  // ✅ MOSTRAR MENSAJE PREMIUM
  document.getElementById("errorPremium").style.display = "block";
  console.log("❌ Acceso denegado — mensaje premium activo");

  return;
}

    console.log("✅ Credenciales válidas — acceso permitido");

// ✅ MARCAR LOGIN COMO ACEPTADO PARA ACCIÓN 4/5-A.3
sessionStorage.setItem("CFC_LOGIN_OK", "1");

// ========================================================
// 🔧 FIX CRÍTICO: evitar redeclaración de "email"
// ========================================================
const loginData = await CFC_login(email, license);
const device_id = loginData.device_id;
const session_id = loginData.session_id;
// ========================================================

// ========================================================
// 🔥 BOOT SYNC V5 — restauración automática REAL
// ========================================================
console.log("🟢 Identity OK — Boot V5");
CFC_syncBootV5_start(email);
    
sessionStorage.setItem("CFC_LOGIN_OK", "1");
window.location.href = "../index.html";

</script>
