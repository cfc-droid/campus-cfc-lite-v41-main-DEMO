<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión — Campus CFC LITE V41</title>

    <!-- ✅ Estilos premium -->
    <link rel="stylesheet" href="../css/variables.css?v=20251112" />
    <link rel="stylesheet" href="../css/premium.min.css?v=20251112" />

    <style>
      body {
        background: radial-gradient(circle at center, #000 85%, #111);
        color: #ffd700;
        font-family: Poppins, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .login-box {
        border: 1px solid rgba(255, 215, 0, 0.5);
        border-radius: 20px;
        padding: 40px 30px;
        box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
        text-align: center;
        width: 320px;
        background: rgba(255, 255, 255, 0.03);

      h1 {
        font-size: 22px;

      p {
        font-size: 13px;

      }

      input {
        width: 100%;
        margin: 10px 0;
        padding: 10px;
        border-radius: 10px;

        background: rgba(255, 255, 255, 0.1);

        text-align: center;

        outline: none;
      }

      button {
        background-color: #ffd700;

      }

    </style>

  <body>
    <div class="login-box">
      <h1>Bienvenido</h1>
      <p>Acceso exclusivo al Campus CFC</p>
      <form id="loginForm">
        <input
          id="email"
          type="email"
          placeholder="Correo electrónico"
          autocomplete="username"
          required
        />
        <input
          id="license"
          type="text"
          placeholder="Clave de licencia"
          autocomplete="off"
          required
        />
        <button type="submit">Entrar</button>
      </form>
    </div>

    <!-- ==========================================================
         🔧 Cloudflare SAFE MODE (Firebase AppCheck OFF)
         ========================================================== -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        initializeAppCheck,
        ReCaptchaV3Provider,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDLWDiJaXYQbXeDAp8uE6-7abSdyBBabys",
        authDomain: "cfc-lock-firebase.firebaseapp.com",
        projectId: "cfc-lock-firebase",
      };

      const app = initializeApp(firebaseConfig);
      initializeAppCheck(app, {
        provider: new ReCaptchaV3Provider("dummy-key"),
        isTokenAutoRefreshEnabled: false,
      });

      console.log("🧩 AppCheck deshabilitado (modo Cloudflare SAFE).");
    </script>

    <!-- ==========================================================
         🔐 Login Firebase + Render Proxy (Sesión única entre dispositivos)
         ========================================================== -->
    <script type="module">
      import { CFC_login } from "../js/core/cfc_lock_identity.js";
      import { CFC_showBlockOverlay } from "../js/overlay_block.js";
      import { checkSession, startHeartbeat, registerLogin } from "../js/core/cfc_api.js";

      // 🧠 Generador persistente de Device ID
      function getDeviceId() {
        const key = "CFC_DEVICE_ID";
        let id = localStorage.getItem(key);
        if (!id) {
          id = crypto.randomUUID ? crypto.randomUUID() : "device-" + Date.now();
          localStorage.setItem(key, id);
        }
        return id;
      }

      const form = document.getElementById("loginForm");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const license = document.getElementById("license").value.trim();
        const device_id = getDeviceId();

        console.log("🟡 Intentando login Firebase:", email);

        try {
          // 1️⃣ Autenticación Firebase
          await CFC_login(email, license);

          // 2️⃣ Registrar login en Render (marca el nuevo dispositivo)
          const registered = await registerLogin(email, device_id);
          if (!registered) {
            CFC_showBlockOverlay("⚠️ No se pudo registrar la sesión.");
            return;
          }

          // 3️⃣ Verificar que la sesión sea válida (única)
          const valid = await checkSession(email, device_id);
          if (!valid) {
            CFC_showBlockOverlay("⚠️ Este usuario ya tiene una sesión activa en otro dispositivo.");
            return;
          }

          // 4️⃣ Iniciar heartbeats automáticos
          startHeartbeat(email, device_id);
          console.log("🟢 Autenticación completa. Redirigiendo al Campus...");
          window.location.href = "../index.html";
        } catch (err) {
          console.error("❌ Error durante el login:", err.message || err);
          CFC_showBlockOverlay("⚠️ Error durante el login (ver consola).");
        }
      });
    </script>

    <!-- ✅ Overlay Premium -->
    <script type="module" src="../js/overlay_block.js?v=47.3"></script>

    <script>
      console.log("✅ CFC_FUNC_59_0_LOGIN_UI_FIREBASE_RENDER_UNIQUE_SESSION_FINAL activo");

    <!-- CFC-SYNC — JS BUNDLE (E) -->

    <!-- CFC-SYNC — HEARTCORE MONITOR (G) -->

    <!-- CFC-SYNC — HEARTBEAT DE DOMINIO (B) -->
    <script>
      setInterval(() => {
        if (!window.CFC_DOMAIN_OK) {
          window.location.href = "/frontend/blocked.html";
        }
      }, 10000);
    </script>

  </body>
