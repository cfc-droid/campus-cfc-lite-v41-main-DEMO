<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión — Campus CFC LITE V41</title>

    <!-- ✅ Estilos premium -->
    <link rel="stylesheet" href="../css/variables.css?v=20251112" />
    <link rel="stylesheet" href="../css/premium.min.css?v=20251112" />

    <style>
      body {
        background: radial-gradient(circle at center, #000 85%, #111);
        color: #ffd700;
        font-family: Poppins, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .login-box {
        border: 1px solid rgba(255, 215, 0, 0.5);
        border-radius: 20px;
        padding: 40px 30px;
        box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
        text-align: center;
        width: 320px;
        background: rgba(255, 255, 255, 0.03);
      }

      h1 {
        font-size: 22px;
        margin-bottom: 5px;
        color: #ffd700;
      }

      p {
        font-size: 13px;
        opacity: 0.85;
        margin-bottom: 20px;
      }

      input {
        width: 100%;
        margin: 10px 0;
        padding: 10px;
        border-radius: 10px;
        border: none;
        background: rgba(255, 255, 255, 0.1);
        color: #ffd700;
        text-align: center;
        font-size: 14px;
        outline: none;
      }

      button {
        background-color: #ffd700;
        color: #000;
        border: none;
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.25s;
        font-weight: bold;
        width: 100%;
        margin-top: 10px;
      }

      button:hover {
        background-color: #fff;
        color: #000;
      }

      .error-msg {
        color: #ff4d4d;
        font-size: 12px;
        margin-top: 10px;
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="login-box">
      <h1>Bienvenido</h1>
      <p>Acceso exclusivo al Campus CFC</p>
      <form id="loginForm">
        <input id="email" type="email" placeholder="Correo electrónico" required />
        <input id="license" type="text" placeholder="Clave de licencia" required />
        <button type="submit">Entrar</button>
        <div id="errorMsg" class="error-msg">Credenciales no válidas</div>
      </form>
    </div>

    <!-- ✅ HANDLER REAL SIN MSCU -->
   <script>
  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const license = document.getElementById("license").value.trim();
    const errorMsg = document.getElementById("errorMsg");

    if (email === "" || license === "") {
      errorMsg.style.display = "block";
      console.log("❌ Acceso denegado — faltan credenciales");
      return;
    }

    errorMsg.style.display = "none";
    console.log("✅ Credenciales ingresadas — login permitido (sin MSCU)");

    // ✅ MARCAR LOGIN COMO ACEPTADO PARA ACCIÓN 4/5-A.3
    sessionStorage.setItem("CFC_LOGIN_OK", "1");

    // ⏸ NO REDIRIGE AÚN
  });
</script>

    <!-- ✅ CFC_FUNC SYNC CHECKPOINT -->
    <script>
      console.log("🧩 CFC_SYNC checkpoint: login.html — handler restaurado sin MSCU");
    </script>

</html>
