<!-- ✅ CFC_FUNC_47_0_LOGIN_INTERFACE -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Campus CFC</title>
  <link rel="stylesheet" href="../css/premium.min.css?v=20251109">
  <style>
    body {
      background: #000;
      color: #FFD700;
      font-family: Poppins, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
    }
    .login-box {
      border: 1px solid #FFD700;
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 0 25px rgba(255,215,0,0.2);
      text-align: center;
      width: 300px;
    }
    input {
      width: 90%;
      margin: 10px 0;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #FFD700;
      background: transparent;
      color: #FFD700;
      text-align: center;
      font-size: 14px;
    }
    button {
      background-color: #FFD700;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }
    button:hover { background-color: #E5C100; }
    h1 { font-size: 22px; margin-bottom: 10px; }
    p { font-size: 13px; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Bienvenido</h1>
    <p>Acceso exclusivo al Campus CFC</p>
    <input id="email" type="email" placeholder="Correo electrónico">
    <input id="pass" type="password" placeholder="Contraseña">
    <button onclick="CFC_login(email.value, pass.value)">Entrar</button>
  </div>

  <script type="module" src="../js/core/cfc_lock_identity.js?v=47.0"></script>
</body>
</html>
